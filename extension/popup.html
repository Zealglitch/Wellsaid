<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WellSaid Popup</title>
<style>
:root {
  --bg: #faf7f2;
  --card: #fff;
  --ink: #1e1b18;
  --mute: #6f675f;
  --line: #e6dfd5;
  --accent: #c2410c;
  --accent-ink: #fff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171412;
    --card: #221e1b;
    --ink: #f3ede6;
    --mute: #a39a90;
    --line: #38322d;
    --accent: #fb923c;
    --accent-ink: #1a1008;
  }
}
* { box-sizing: border-box; }

html {
  background: transparent;
  border-radius: 16px;
}

body {
  width: 365px;
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 Georgia, serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 16px; /* Smooth curved outermost edges of extension */
  border: 1px solid var(--line);
  box-shadow: 0 10px 32px rgba(0, 0, 0, 0.15);
}

/* Pinned top section containing header, inputs, and the Rewrite button */
.top-section {
  flex-shrink: 0;
  padding: 14px 16px 14px;
  background: var(--bg);
  position: relative;
  z-index: 20;
  border-bottom: 1px solid transparent;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.top-section.has-results {
  border-bottom-color: var(--line);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
}

.brand {
  font: 700 1rem system-ui, sans-serif;
  color: var(--accent);
}

.close-btn {
  background: none;
  border: none;
  font-size: 1.15rem;
  color: var(--mute);
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
}
.close-btn:hover {
  color: var(--ink);
  background: var(--line);
}

.sub {
  font: 0.82rem system-ui, sans-serif;
  color: var(--mute);
  margin: 0 0 10px;
}
label {
  display: block;
  font: 600 0.72rem system-ui, sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--mute);
  margin: 8px 0 4px;
}
select, textarea {
  width: 100%;
  font: inherit;
  padding: 9px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s ease;
}
select:focus, textarea:focus {
  border-color: var(--accent);
}
textarea {
  min-height: 75px;
  max-height: 95px;
  resize: none;
}
button.go {
  width: 100%;
  margin-top: 12px;
  font: 600 0.92rem system-ui, sans-serif;
  border: 0;
  border-radius: 12px;
  padding: 11px;
  background: var(--accent);
  color: var(--accent-ink);
  cursor: pointer;
  transition: opacity 0.15s ease;
}
button.go:hover {
  opacity: 0.92;
}
button.go:disabled {
  opacity: 0.6;
  cursor: wait;
}

/* Scrollable area for tone cards - only visible when results exist */
.scrollable-out {
  display: none; /* Hidden by default until user hits Rewrite */
  max-height: 290px;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 16px 16px;
  flex-direction: column;
  gap: 12px;
  scroll-behavior: smooth;
}

.scrollable-out::-webkit-scrollbar {
  width: 6px;
}
.scrollable-out::-webkit-scrollbar-track {
  background: transparent;
}
.scrollable-out::-webkit-scrollbar-thumb {
  background: var(--line);
  border-radius: 4px;
}
.scrollable-out::-webkit-scrollbar-thumb:hover {
  background: var(--mute);
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px;
  margin: 0;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.card:hover {
  border-color: var(--accent);
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}
.tag {
  font: 700 0.7rem system-ui, sans-serif;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--accent);
  margin-bottom: 4px;
}
.txt {
  white-space: pre-wrap;
  font-size: 0.88rem;
  line-height: 1.5;
}
button.ghost {
  background: transparent;
  color: var(--mute);
  border: 1px solid var(--line);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  margin-top: 8px;
  cursor: pointer;
  transition: all 0.15s ease;
}
button.ghost:hover {
  color: var(--accent);
  border-color: var(--accent);
}
.err {
  color: #b91c1c;
  background: rgba(185, 28, 28, 0.08);
  border: 1px solid #f87171;
  border-radius: 10px;
  padding: 8px 12px;
  font: 0.85rem system-ui, sans-serif;
  margin-top: 10px;
}
.pro-badge {
  font: 700 0.65rem system-ui, sans-serif;
  letter-spacing: 0.05em;
  background: rgba(194, 65, 12, 0.12);
  color: var(--accent);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid rgba(194, 65, 12, 0.25);
  margin-left: 4px;
}
.account-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--mute);
  font: 500 0.75rem system-ui, sans-serif;
  padding: 3px 8px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.account-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}
.auth-modal {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(2px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
}
.auth-dialog {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  width: 100%;
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
}
.card.card-locked {
  position: relative;
  overflow: hidden;
  user-select: none;
}
.card.card-locked .txt {
  filter: blur(3.5px);
  opacity: 0.55;
}
.lock-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 0.7rem;
  font-weight: 700;
  color: var(--accent);
  background: rgba(194, 65, 12, 0.08);
  padding: 2px 6px;
  border-radius: 4px;
}
.unlock-box {
  background: rgba(194, 65, 12, 0.04);
  border: 1px solid rgba(194, 65, 12, 0.3);
  border-radius: 12px;
  padding: 14px 12px;
  text-align: center;
}
</style>
</head>
<body>
  <!-- Fixed Top Section (stays permanently visible while results scroll underneath) -->
  <div class="top-section" id="top-section">
    <!-- Top row with Brand, Pro badge, Sign In button and Close cross button -->
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;">
      <div class="brand" style="display:flex; align-items:center; gap:6px;">
        <img src="icons/icon32.png" width="18" height="18" alt="WellSaid" style="border-radius:4px; flex-shrink:0;">
        <span>WellSaid</span>
        <span id="pro-badge" class="pro-badge" style="display:none;">PRO</span>
      </div>
      <div style="display:flex; align-items:center; gap:6px;">
        <button id="account-btn" type="button" class="account-btn">Sign In</button>
        <button id="close-btn" class="close-btn" type="button" title="Close" aria-label="Close">✕</button>
      </div>
    </div>
    <p class="sub">Say the hard thing, well.</p>

    <label for="kind">What is it?</label>
    <select id="kind">
      <option>An apology</option>
      <option>Asking for a raise</option>
      <option>Declining an invite</option>
      <option>Ending a relationship</option>
      <option>Setting a boundary</option>
      <option>Giving tough feedback</option>
      <option>Something else</option>
    </select>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; margin-bottom:4px;">
      <label for="msg" style="margin:0;">Your message</label>
      <button id="clear-btn" type="button" style="background:none; border:none; color:var(--mute); font:500 0.75rem system-ui,sans-serif; cursor:pointer; padding:2px 4px; text-decoration:underline;">Clear</button>
    </div>
    <textarea id="msg" placeholder="Type what you dread to send..."></textarea>

    <button class="go" id="go">Rewrite it</button>
    <div class="err" id="err" style="display:none;"></div>
  </div>

  <!-- Scrollable Results Container (Hidden until results are ready) -->
  <div id="out" class="scrollable-out"></div>

  <!-- Authentication & Account Modal -->
  <div id="auth-modal" class="auth-modal" style="display:none;">
    <div class="auth-dialog">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font:700 0.95rem system-ui,sans-serif; color:var(--ink);">WellSaid Account</div>
        <button id="auth-close-btn" class="close-btn" type="button">✕</button>
      </div>

      <!-- Logged in view -->
      <div id="auth-active-view" style="display:none;">
        <div style="padding:10px; background:rgba(194,65,12,0.08); border-radius:10px; margin-bottom:12px; border:1px solid rgba(194,65,12,0.2);">
          <div style="font:700 0.8rem system-ui,sans-serif; color:var(--accent); text-transform:uppercase;">✓ Lifetime Pro Active</div>
          <div id="auth-user-email" style="font-size:0.82rem; color:var(--ink); margin-top:4px; word-break:break-all;"></div>
        </div>
        <button id="sign-out-btn" class="ghost" style="width:100%; border-color:#ef4444; color:#ef4444; margin-top:4px;">Sign Out</button>
      </div>

      <!-- Logged out view -->
      <div id="auth-form-view">
        <p style="font-size:0.8rem; color:var(--mute); margin:0 0 10px; line-height:1.4;">
          Enter the email you used at checkout (or license key) to unlock all tones across all your devices:
        </p>
        <input type="email" id="auth-email-input" placeholder="name@example.com" style="width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font:inherit; font-size:0.85rem; margin-bottom:8px; background:var(--card); color:var(--ink);" />
        <button id="auth-submit-btn" class="go" style="margin-top:2px; padding:9px;">Activate / Sign In</button>
        <div id="auth-msg" style="display:none; margin-top:8px; font-size:0.8rem; padding:6px; border-radius:6px;"></div>

        <div style="margin-top:12px; padding-top:10px; border-top:1px solid var(--line); text-align:center;">
          <span style="font-size:0.75rem; color:var(--mute);">Don't have a license?</span><br />
          <a id="buy-pro-link" href="https://dodo.pe/wellsaid" target="_blank" style="color:var(--accent); font-weight:600; font-size:0.82rem; text-decoration:none; display:inline-block; margin-top:3px;">Get Lifetime Access ($2.99) →</a>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
